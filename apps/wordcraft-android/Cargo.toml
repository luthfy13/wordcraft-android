[package]
name = "wordcraft-android"
description = "WordCraft on Android tablets (Folio Writer): android-activity + egui + wgpu, without eframe or winit"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The workspace forbids unsafe code, which can't be allowed again further down. This crate denies it
# instead, so that one module (`src/android/entry.rs`) can allow it: Android finds `android_main` and the
# native method `MainActivity.nativeSetLaunchArgs` by name, and exporting an unmangled symbol is
# `#[unsafe(no_mangle)]`. That module has no `unsafe` block. The rest are the workspace's lints.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[lib]
# Loaded by the activity as `libwordcraft_android.so`.
crate-type = ["cdylib"]

# The platform-independent host (`host.rs`, `input.rs`, `keymap.rs`, `store.rs`, `recovery.rs`) builds
# and is tested everywhere.
[dependencies]
wordcraft-doc = { workspace = true }
wordcraft-engine = { workspace = true }
wordcraft-fonts = { workspace = true }
wordcraft-ui-egui = { workspace = true }
egui = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
# The activity glue (GameActivity 4.4.0 on the Java side; its text input is what the IME work builds on),
# the window and the input events. Already a dependency of winit's Android backend, at this version.
android-activity = { version = "0.6.1", features = ["game-activity"] }
# The activity's launch arguments come in through a native method; keys' characters come from Android's
# key character maps. The version android-activity uses (it sets up the VM this crate's calls use).
jni = "0.22.4"
android_logger = { version = "0.15", default-features = false }
# egui's wgpu renderer without winit or the web backends; wgpu with Vulkan and its OpenGL ES fallback.
egui-wgpu = { version = "0.36", default-features = false }
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl", "vulkan", "gles"] }
# The window and configuration types of android-activity; `rwh_06` gives `NativeWindow` the window handle
# wgpu takes (android-activity turns ndk's default features off).
ndk = { version = "0.9", default-features = false, features = ["rwh_06"] }
# Waits for wgpu's adapter and device requests (already in the tree through the desktop app).
pollster = "0.4"
