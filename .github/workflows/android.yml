# Android (Folio Writer, apps/wordcraft-android): lints and tests the Android host on Linux and for the
# Android target, builds the debug APK (arm64-v8a for tablets, x86_64 for the emulator) and starts it on
# tablet emulators (API 34 and 36): install, sample document on Vulkan and on OpenGL ES, screenshots, no
# crash, and a deliberate panic that must reach logcat with its backtrace.
#
# Runs on pushes and pull requests that touch the Android app or what it's built from.
name: Android

on:
  push:
    paths:
      - "apps/wordcraft-android/**"
      - "crates/**"
      - "assets/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "rustfmt.toml"
      - "clippy.toml"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "apps/wordcraft-android/**"
      - "crates/**"
      - "assets/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "rustfmt.toml"
      - "clippy.toml"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # The toolchain the Android host was checked with; raise it deliberately.
  RUST_TOOLCHAIN: "1.97.0"
  CARGO_NDK_VERSION: "4.1.2"
  # Must match `ndkVersion` in apps/wordcraft-android/android/app/build.gradle.kts.
  NDK_VERSION: "28.2.13676358"
  ANDROID_DIR: apps/wordcraft-android/android

jobs:
  build:
    name: Lint, test and build the APK
    # Pinned: ubuntu-latest moves to 26.04 in November 2026.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android,x86_64-linux-android
          components: clippy,rustfmt

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 ndk;${{ env.NDK_VERSION }}"

      # The image's default NDK is r27; cargo-ndk reads these.
      - name: Use NDK ${{ env.NDK_VERSION }}
        run: |
          for v in ANDROID_NDK_HOME ANDROID_NDK_ROOT ANDROID_NDK; do
            echo "$v=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          done

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: android

      - name: Install cargo-ndk
        run: |
          if [ "$(cargo ndk --version 2>/dev/null)" != "cargo-ndk $CARGO_NDK_VERSION" ]; then
            cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked
          fi

      - name: Format
        run: cargo fmt -p wordcraft-android -- --check

      - name: Clippy and tests (Linux)
        run: |
          cargo clippy -p wordcraft-android --all-targets --locked -- -D warnings
          cargo test -p wordcraft-android --locked

      # `cargo xtask ci` builds on Linux only, where the Android modules are left out.
      - name: Clippy (Android)
        run: cargo ndk --target arm64-v8a --platform 29 clippy -p wordcraft-android --locked -- -D warnings

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Build the debug APK
        working-directory: ${{ env.ANDROID_DIR }}
        run: ./gradlew --stacktrace assembleDebug -Pfolio.abis=arm64-v8a,x86_64

      # Google Play requires 16 KB pages: every LOAD segment of the native libraries aligned to 16 KB.
      # (The debug APK stores the libraries compressed; the release APK's page-aligned storage is checked
      # with the release build.)
      - name: Check 16 KB alignment
        run: |
          apks=("$ANDROID_DIR"/app/build/outputs/apk/debug/*.apk)
          apk=${apks[0]}
          readelf="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          bad=0
          unzip -Z1 "$apk" 'lib/*.so' > "$RUNNER_TEMP/libs.txt"
          while read -r so; do
            unzip -o -q "$apk" "$so" -d "$RUNNER_TEMP/libs"
            while read -r align; do
              if [ $((align)) -lt 16384 ]; then echo "::error::$so has a LOAD segment aligned to $align"; bad=1; fi
            done < <("$readelf" -lW "$RUNNER_TEMP/libs/$so" | awk '$1 == "LOAD" { print $NF }')
            echo "$so: $(stat -c %s "$RUNNER_TEMP/libs/$so") bytes"
          done < "$RUNNER_TEMP/libs.txt"
          echo "$apk: $(stat -c %s "$apk") bytes"
          exit "$bad"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: folio-writer-debug-apk
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  smoke:
    name: Emulator smoke test (API ${{ matrix.api-level }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # 34: the most revised image; 36: the target SDK.
        api-level: [34, 36]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: folio-writer-debug-apk
          path: ${{ runner.temp }}/apk

      - name: Find the APK
        run: |
          apks=("$RUNNER_TEMP"/apk/*.apk)
          echo "APK=${apks[0]}" >> "$GITHUB_ENV"

      # Hardware acceleration for the emulator.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          # A tablet: 2560×1600 at 320 dpi.
          profile: pixel_tablet
          cores: 4
          ram-size: 4096M
          force-avd-creation: true
          disable-animations: true
          emulator-boot-timeout: 900
          # SwiftShader gives the guest both OpenGL ES and Vulkan (`swiftshader_indirect` is deprecated).
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim
          script: bash apps/wordcraft-android/ci/smoke.sh "$APK" "$RUNNER_TEMP/smoke"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: smoke-api-${{ matrix.api-level }}
          path: ${{ runner.temp }}/smoke
          retention-days: 14
